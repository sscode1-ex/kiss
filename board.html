<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Notice Board</title>
<!-- SSWIFT staff notice board (v3.236). Opened full screen on the staff-room TV:
     board.html?u=<staff links web app /exec address>&k=<board key>   (the Hub's Notice Board panel shows the full link) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--blue:#1a6fd6;--ink:#14202e;--mute:#5d6b7a;--line:#d5dde6;--band:#eef3f9;--today:#fff4cc;--in:#0b7a3b;--out:#a33;--bg:#f7f9fb}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;cursor:none}
#night{position:fixed;inset:0;background:#000;display:none;z-index:9}
header{height:9vh;display:flex;align-items:center;gap:2vw;padding:0 2.2vw;background:var(--hd,var(--blue));color:#fff;transition:background .4s}
body[data-k=this]{--hd:#137a3e;--th:#0d5c2e}
body[data-k=next]{--hd:#6a3fb5;--th:#4f2c8c}
body[data-k=notice]{--hd:#1a6fd6}
.pill{display:none;background:#fff;color:var(--hd);font-weight:800;font-size:3.6vh;letter-spacing:.06em;padding:.25vh 1.4vw;border-radius:1vh;text-transform:uppercase}
body[data-k=this] .pill,body[data-k=next] .pill{display:inline-block}
header h1{font-size:4.4vh;font-weight:700;letter-spacing:.02em}
header .sub{font-size:2.8vh;opacity:.92}
header .clock{margin-left:auto;text-align:right;font-size:2.4vh;line-height:1.25}
header .clock b{font-size:4vh;display:block}
main{position:absolute;top:9vh;bottom:4.5vh;left:0;right:0;padding:1.2vh 1.4vw}
footer{position:absolute;bottom:0;left:0;right:0;height:4.5vh;display:flex;align-items:center;gap:1.4vw;padding:0 2vw;font-size:2vh;color:var(--mute);border-top:1px solid var(--line);background:#fff}
footer .dots{margin-left:auto;display:flex;gap:.6vw}
footer .dots i{width:1.2vh;height:1.2vh;border-radius:50%;background:var(--line)}
footer .dots i.on{background:var(--blue)}
footer .warn{color:var(--out);font-weight:600}
.slide{position:absolute;inset:1.2vh 1.4vw;display:none}
.slide.show{display:block}
table{width:100%;height:auto;border-collapse:collapse;table-layout:fixed;background:#fff;font-size:var(--fs,2.2vh)}
th,td{border:1px solid var(--line);padding:.1em .35em;vertical-align:top;line-height:1.12;overflow:hidden}
thead th{background:var(--th,var(--ink));color:#fff;font-weight:600;text-align:center}
thead th.name{text-align:left;width:16%}
thead th.today{background:#c98a00}
td.today{background:var(--today)}
tr.z td{background:#dde5ee}
tr.z td.today{background:#f2df98}
tr.dept td{background:var(--band);font-weight:700;color:var(--th,var(--blue));text-transform:uppercase;letter-spacing:.04em;font-size:.72em;padding:0 .4em;line-height:1.3}
td.name{font-weight:600;white-space:nowrap;text-overflow:ellipsis}
.s{white-space:nowrap}
.l{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s.out{color:var(--out);text-decoration:line-through;opacity:.75}
.s.in{color:var(--in);font-weight:700}
.n{font-size:.75em;color:var(--mute);margin-left:.3em}
.s.in+.n{color:var(--in)}
.empty{display:flex;height:100%;align-items:center;justify-content:center;font-size:4vh;color:var(--mute);text-align:center}
.notice{display:flex;align-items:center;justify-content:center;height:100%}
.notice img,.notice canvas{max-width:100%;max-height:100%;box-shadow:0 .4vh 2vh rgba(0,0,0,.18);background:#fff}
.quote{display:flex !important;flex-direction:row;align-items:center;justify-content:center;gap:5vw;padding:0 6vw}
.quote .toon{flex:0 0 34vh;height:34vh;animation:bob 3s ease-in-out infinite}
.quote .toon svg{width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-2vh) rotate(3deg)}}
.quote .qtext{flex:1;text-align:left;max-width:62vw}
.quote .qmark{font-size:20vh;line-height:.6;color:var(--blue);font-family:Georgia,serif;height:9vh}
.quote p{font-size:6.4vh;font-weight:700;line-height:1.25;color:var(--ink)}
.quote .qwho{margin-top:2vh;font-size:3.6vh;font-weight:600;color:var(--blue)}
.quote .qby{margin-top:3vh;font-size:2.4vh;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.joke .bubble{position:relative;background:#fff;border:.5vh solid var(--blue);border-radius:4vh;padding:3vh 3.5vw;box-shadow:0 1vh 3vh rgba(0,0,0,.08)}
.joke .bubble:before{content:"";position:absolute;left:-3.2vh;top:45%;border:2.2vh solid transparent;border-right:3vh solid var(--blue)}
.joke .jq{font-size:5.6vh;margin:0}
.joke .ja{font-size:6vh;font-weight:800;color:#c25e00;margin-top:4vh;opacity:0;transform:scale(.6);transition:all .6s cubic-bezier(.2,1.6,.4,1)}
.joke .ja.on{opacity:1;transform:scale(1)}
#msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:3.4vh;color:var(--mute);text-align:center;padding:10vw;background:var(--bg);z-index:5}
</style>
</head>

<main id="stage"></main>
<footer><span id="upd"></span><span class="warn" id="warn"></span><span class="dots" id="dots"></span></footer>
<div id="msg"></div>
<div id="night"></div>

  function tick() {
    var d = new Date();
    $("time").textContent = d.toLocaleTimeString("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
    $("date").textContent = d.toLocaleDateString("en-AU", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
    var on = isOn();
    $("night").style.display = on ? "none" : "block";
    if (!on && today() !== loadedDay) location.reload();          // fresh page once a day, overnight
    var stale = lastOk && Date.now() - lastOk > 30 * 60 * 1000;
    $("warn").textContent = stale ? "Can't reach the Hub board - showing the last copy" : "";
  }
  function msg(t) { $("msg").style.display = t ? "flex" : "none"; $("msg").textContent = t || ""; }

  /* ---------- data ---------- */
  /* 2026-11-10: a time limit - straight after power-on the Wi-Fi isn't up and a request could hang for ever */
  function get(extra) {
    var ctl = window.AbortController ? new AbortController() : null;
    var t = ctl && setTimeout(function () { ctl.abort(); }, 45000);
    return fetch(U + (U.indexOf("?") < 0 ? "?" : "&") + "b=" + encodeURIComponent(K) + (extra || ""),
                 ctl ? { cache: "no-store", signal: ctl.signal } : { cache: "no-store" })
      .then(function (r) { if (t) clearTimeout(t); return r.json(); }, function (e) { if (t) clearTimeout(t); throw e; })
      .then(function (j) { if (!j.ok) throw new Error(j.error || "No answer"); return j; });
  }
  function save(j) { try { localStorage.setItem("board", JSON.stringify(j)); } catch (e) {} }
  function saved() { try { return JSON.parse(localStorage.getItem("board") || "null"); } catch (e) { return null; } }

  function b64bytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fit(w, h) {
    var box = $("stage").getBoundingClientRect(), s = Math.min((box.width - 30) / w, (box.height - 30) / h);
    return Math.max(s, 0.1);
  }
  /* 2026-11-10: a TV stick has little memory - keep each PDF page as a small JPEG picture, not a full-size drawing */
  function toImage(c) {
    return new Promise(function (ok) {
      var done = function (url) { c.width = c.height = 0; var img = new Image(); img.src = url; ok(img); };
      if (c.toBlob) c.toBlob(function (b) { done(b ? URL.createObjectURL(b) : c.toDataURL("image/jpeg", 0.85)); }, "image/jpeg", 0.85);
      else done(c.toDataURL("image/jpeg", 0.85));
    });
  }
  function loadFile(n) {
    if (files[n.id]) return files[n.id];
    files[n.id] = get("&f=" + encodeURIComponent(n.id)).then(function (j) {
      if (/pdf/.test(j.mime)) {
        if (!window.pdfjsLib) throw new Error("PDF reader didn't load");
        return pdfjsLib.getDocument({ data: b64bytes(j.data) }).promise.then(function (pdf) {
          var jobs = [];
          for (var p = 1; p <= Math.min(pdf.numPages, MAX_PDF_PAGES); p++) {
            jobs.push(pdf.getPage(p).then(function (page) {
              var v1 = page.getViewport({ scale: 1 }), v = page.getViewport({ scale: fit(v1.width, v1.height) });
              var c = document.createElement("canvas");
              c.width = Math.round(v.width); c.height = Math.round(v.height);
              return page.render({ canvasContext: c.getContext("2d"), viewport: v }).promise.then(function () { return toImage(c); });
            }));
          }
          return Promise.all(jobs).then(function (imgs) { try { pdf.destroy(); } catch (e) {} return imgs; });
        });
      }
      var img = new Image();
      img.src = "data:" + j.mime + ";base64," + j.data;
      return [img];
    }).catch(function (e) { delete files[n.id]; throw e; });
    return files[n.id];
  }

  /* ---------- roster ---------- */
  function rosterTable(w, depts, isThis) {
    var t = today();
    var head = '<tr><th class="name">Name</th>' + w.days.map(function (d) {
      return '<th class="' + (isThis && d.date === t ? "today" : "") + '">' + esc(d.label) + "</th>";
    }).join("") + "</tr>";
    var body = depts.map(function (g) {
      return '<tr class="dept"><td colspan="8">' + esc(g.dept) + "</td></tr>" + g.people.map(function (p, n) {
        return "<tr" + (n % 2 ? ' class="z"' : "") + '><td class="name">' + esc(p.name) + "</td>" + p.days.map(function (cell, i) {
          var cls = isThis && w.days[i].date === t ? ' class="today"' : "";
          return "<td" + cls + ">" + cell.map(function (s) {
            return '<span class="l"><span class="s ' + esc(s.s) + '">' + esc(s.t) + "</span>" + (s.n ? '<span class="n">' + esc(s.n) + "</span>" : "") + "</span>";
          }).join("") + "</td>";
        }).join("") + "</tr>";
      }).join("");
    }).join("");
    return "<table><thead>" + head + "</thead><tbody>" + body + "</tbody></table>";
  }
  /* biggest font that fits; if even the smallest won't, split the departments over more slides */
  function rosterSlides(w, title, isThis) {
    var out = [], left = w.depts.slice(), probe = document.createElement("div");
    probe.className = "slide show"; probe.style.visibility = "hidden";
    $("stage").appendChild(probe);
    var room = probe.clientHeight;
    function fits(depts, fs) { probe.innerHTML = rosterTable(w, depts, isThis); probe.firstChild.style.setProperty("--fs", fs + "vh"); return probe.firstChild.offsetHeight <= room; }
    while (left.length) {
      var take = left.length, fs = 2.6;
      while (fs > 1.05 && !fits(left.slice(0, take), fs)) fs -= 0.05;
      while (take > 1 && !fits(left.slice(0, take), fs)) take--;
      out.push({ kind: "roster", title: title, html: rosterTable(w, left.slice(0, take), isThis), fs: fs });
      left = left.slice(take);
    }
    probe.remove();
    if (out.length > 1) out.forEach(function (s, i) { s.title += " (" + (i + 1) + " of " + out.length + ")"; });
    return out;
  }
  function range(w) {
    var a = new Date(w.days[0].date + "T00:00:00"), b = new Date(w.days[6].date + "T00:00:00");
    return a.toLocaleDateString("en-AU", { day: "numeric", month: "short" }) + " – " + b.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
  }

  /* ---------- slides ---------- */
  function build() {
    var s = data.settings || {}, list = [];
    (data.weeks || []).forEach(function (w, i) {
      var title = range(w);
      if (!w.have) return;                                   // 2026-11-11: not published - no slide
      rosterSlides(w, title, i === 0).forEach(function (x) { x.secs = s.roster_secs; x.wk = i; list.push(x); });
    });
    list.push({ kind: "quote", title: "Quote of the day", secs: 10 });
    list.push({ kind: "joke", title: "Joke of the day", secs: 10 });     // punchline at 5 s
    (data.notices || []).forEach(function (n) { list.push({ kind: "notice", title: n.name.replace(/\.[a-z0-9]+$/i, "").replace(/^\d+[\s._-]*/, ""), notice: n, secs: n.secs || s.notice_secs }); });
    slides = list;
    $("store").textContent = data.store ? data.store.replace(/^Foodland\s+/, "") + " · Staff Board" : "Staff Notice Board";
    $("upd").textContent = "Roster from the Hub · updated " + new Date().toLocaleTimeString("en-AU", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
    if (at >= slides.length) at = 0;
  }
  var lastShow = Date.now();
  function show(i) {
    clearTimeout(timer);
    lastShow = Date.now();
    if (!slides.length) { timer = setTimeout(function () { show(0); }, 10000); return; }
    at = i % slides.length;
    var sl = slides[at], st = $("stage");
    $("what").textContent = sl.title;
    document.body.dataset.k = sl.kind === "notice" || sl.kind === "quote" || sl.kind === "joke" ? "notice" : sl.wk === 0 ? "this" : "next";
    $("pill").textContent = sl.wk === 0 ? "This week" : "Next week";
    $("dots").innerHTML = slides.map(function (_, k) { return '<i class="' + (k === at ? "on" : "") + '"></i>'; }).join("");
    if (sl.kind === "quote") {
      var qd = quoteOfDay();
      st.innerHTML = '<div class="slide show quote"><div class="toon">' + qd.toon + '</div><div class="qtext"><div class="qmark">&ldquo;</div><p></p>' +
        '<div class="qwho"></div><div class="qby">Quote of the day</div></div></div>';
      st.querySelector("p").textContent = qd.q[0];
      st.querySelector(".qwho").textContent = qd.q[1] ? "— " + qd.q[1] : "";
      timer = setTimeout(function () { show(at + 1); }, (sl.secs || 20) * 1000);
      return;
    }
    if (sl.kind === "joke") {
      var jd = jokeOfDay();
      st.innerHTML = '<div class="slide show quote joke"><div class="toon">' + jd.toon + '</div><div class="qtext">' +
        '<div class="bubble"><p class="jq"></p></div><p class="ja"></p><div class="qby">Joke of the day</div></div></div>';
      st.querySelector(".jq").textContent = jd.j[0];
      st.querySelector(".ja").textContent = jd.j[1];
      setTimeout(function () { var a = st.querySelector(".ja"); if (a) a.classList.add("on"); }, 5000);
      timer = setTimeout(function () { show(at + 1); }, (sl.secs || 20) * 1000);
      return;
    }
    if (sl.kind === "roster") {
      st.innerHTML = '<div class="slide show">' + sl.html + "</div>";
      if (sl.fs) st.querySelector("table") && st.querySelector("table").style.setProperty("--fs", sl.fs + "vh");
      timer = setTimeout(function () { show(at + 1); }, (sl.secs || 45) * 1000);
      return;
    }
    loadFile(sl.notice).then(function (pages) {
      var k = 0;
      (function page() {
        st.innerHTML = '<div class="slide show notice"></div>';
        st.firstChild.appendChild(pages[k]);
        if (pages.length > 1) $("what").textContent = sl.title + " (" + (k + 1) + " of " + pages.length + ")";
        timer = setTimeout(function () { if (++k < pages.length) page(); else show(at + 1); }, (sl.secs || 20) * 1000);
      })();
    }).catch(function () { show(at + 1); });
  }
  function refresh(first) {
    return get("").then(function (j) {
      data = j; lastOk = Date.now(); save(j); msg("");
      var keep = {};
      (j.notices || []).forEach(function (n) { keep[n.id] = true; });
      Object.keys(files).forEach(function (id) {
        if (keep[id]) return;
        Promise.resolve(files[id]).then(function (imgs) { (imgs || []).forEach(function (im) { if (im.src && im.src.indexOf("blob:") === 0) URL.revokeObjectURL(im.src); }); }).catch(function () {});
        delete files[id];
      });
      build();
      if (first || !started) start();          // the slides start on whichever load works first
    }).catch(function (e) {
      if (!data) {
        var old = saved();
        if (old) { data = old; build(); start(); }
        else msg(!U || !K ? "This board link is missing its address or key - copy the full link from the Hub's Notice Board panel."
          : "Can't load the board yet (" + e.message + "). Trying again in a minute.");
      }
      if (first) setTimeout(function () { refresh(!data); }, started ? 60000 : 20000);
    });
  }
  var started = false, bootAt = Date.now();
  /* 2026-11-10 watchdog: slides not moving for 4 minutes - move on; 10 minutes - load the page again.
     And a fresh page every 4 hours while on, so a small TV stick's memory never fills up. */
  setInterval(function () {
    if (!started || !isOn()) return;
    var still = Date.now() - lastShow;
    if (still > 10 * 60 * 1000 || Date.now() - bootAt > 4 * 3600 * 1000) location.reload();
    else if (still > 4 * 60 * 1000) show(at + 1);
  }, 60000);
  function start() { started = true; msg(""); show(0); }
  /* belt and braces: still nothing on screen 3 minutes after power-on - load the page again */
  setInterval(function () { if (!started && Date.now() - bootAt > 3 * 60 * 1000) location.reload(); }, 30000);
  /* the page checks itself every 30 min and reloads when a newer board page is published (no remote needed) */
  var BOARD_VER = "2026-11-11a";
  setInterval(function () {
    fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); })
      .then(function (t) { var m = /BOARD_VER = "([^"]+)"/.exec(t); if (m && m[1] !== BOARD_VER) location.reload(); })
      .catch(function () {});
  }, 30 * 60 * 1000);
  /* 2026-11-10: when the TV stick sleeps (screen saver / energy saver) the page is paused; on waking it would sit
     frozen with the old time - if the page has been paused for over 2 minutes, load it again */
  var lastBeat = Date.now();
  setInterval(function () { var gap = Date.now() - lastBeat; lastBeat = Date.now(); if (gap > 2 * 60 * 1000) location.reload(); }, 5000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && Date.now() - lastBeat > 2 * 60 * 1000) location.reload();
  });
  tick(); setInterval(tick, 15000);
  refresh(true);
  setInterval(function () { if (isOn()) refresh(false); }, POLL_MS);
  if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {});
})();
</script>
</body>
</html>
